<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo blanco -->
  <rect width="100" height="100" fill="white"/>

  <!-- Cruz médica azul (izquierda) -->
  <rect x="7"  y="36" width="10" height="32" rx="3.5" fill="#3ab8e8"/>
  <rect x="3"  y="46" width="18" height="12" rx="3.5" fill="#3ab8e8"/>

  <!-- Herradura/anillo naranja (cabeza) — arco abierto abajo -->
  <path d="M 48 34 A 15 15 0 1 1 78 34"
        stroke="#f5a32a" stroke-width="7" fill="none"
        stroke-linecap="round"/>

  <!-- Círculo azul interior (cara) -->
  <circle cx="63" cy="23" r="7" fill="#3ab8e8"/>

  <!-- Brazo izquierdo — curva azul hacia arriba-izquierda -->
  <path d="M 55 42 Q 44 36 38 24"
        stroke="#3ab8e8" stroke-width="4.5" fill="none"
        stroke-linecap="round"/>

  <!-- Brazo derecho — curva naranja hacia arriba-derecha -->
  <path d="M 70 42 Q 80 34 84 23"
        stroke="#f5a32a" stroke-width="4.5" fill="none"
        stroke-linecap="round"/>

  <!-- Cuerpo — azul bajando y curvándose -->
  <path d="M 63 38 Q 68 54 64 70"
        stroke="#3ab8e8" stroke-width="4.5" fill="none"
        stroke-linecap="round"/>

  <!-- Círculo pequeño azul (rodilla/base del cuerpo) -->
  <circle cx="61" cy="70" r="4" fill="#3ab8e8"/>

  <!-- Arco inferior azul (suelo) -->
  <path d="M 42 82 Q 63 94 82 80"
        stroke="#3ab8e8" stroke-width="4" fill="none"
        stroke-linecap="round"/>
</svg>
