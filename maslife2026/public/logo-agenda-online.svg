<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" fill="none">
  <!-- Calendar icon centered -->
  <g transform="translate(110, 6)">
    <!-- Shadow -->
    <rect x="3" y="12" width="60" height="54" rx="10" fill="#2563EB" opacity="0.08"/>
    <!-- Calendar body -->
    <rect x="0" y="9" width="60" height="54" rx="10" fill="white" stroke="#2563EB" stroke-width="2.5"/>
    <!-- Top header bar -->
    <rect x="0" y="9" width="60" height="20" rx="10" fill="#2563EB"/>
    <rect x="0" y="19" width="60" height="10" fill="#2563EB"/>
    <!-- Ring left -->
    <line x1="18" y1="3" x2="18" y2="15" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Ring right -->
    <line x1="42" y1="3" x2="42" y2="15" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Grid dots -->
    <circle cx="14" cy="38" r="2.5" fill="#CBD5E1"/>
    <circle cx="30" cy="38" r="2.5" fill="#CBD5E1"/>
    <circle cx="46" cy="38" r="2.5" fill="#CBD5E1"/>
    <circle cx="14" cy="52" r="2.5" fill="#CBD5E1"/>
    <circle cx="46" cy="52" r="2.5" fill="#CBD5E1"/>
    <!-- Check mark orange (over center grid) -->
    <path d="M19 44 L27 52 L45 35" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Divider line -->
  <line x1="60" y1="83" x2="220" y2="83" stroke="#E2E8F0" stroke-width="1"/>
  <!-- AGENDA ONLINE label -->
  <text x="140" y="100" font-family="'Manrope', 'Inter', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="3.5" text-anchor="middle">AGENDA ONLINE</text>
  <!-- ClinicaMaslife brand name -->
  <text x="96" y="128" font-family="'Manrope', 'Inter', Arial, sans-serif" font-size="27" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Clinica</text>
  <text x="194" y="128" font-family="'Manrope', 'Inter', Arial, sans-serif" font-size="27" font-weight="800" fill="#2563EB" letter-spacing="-0.5">Maslife</text>
</svg>
