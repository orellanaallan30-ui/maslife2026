<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 215">
  <!-- Calendario -->
  <g transform="translate(5,15)">
    <!-- Sombra -->
    <rect x="6" y="26" width="108" height="100" rx="14" fill="#0284C7" opacity="0.15"/>
    <!-- Cuerpo -->
    <rect x="2" y="22" width="108" height="100" rx="14" fill="white" stroke="#0EA5E9" stroke-width="3"/>
    <!-- Tapa azul -->
    <rect x="2" y="22" width="108" height="28" rx="14" fill="#0EA5E9"/>
    <rect x="2" y="36" width="108" height="14" fill="#0EA5E9"/>
    <!-- Argollas naranjas -->
    <rect x="28" y="6" width="14" height="28" rx="7" fill="#F97316"/>
    <rect x="70" y="6" width="14" height="28" rx="7" fill="#F97316"/>
    <!-- Cuadrícula de puntos celestes -->
    <circle cx="26" cy="68" r="5" fill="#7DD3FC"/>
    <circle cx="56" cy="68" r="5" fill="#7DD3FC"/>
    <circle cx="86" cy="68" r="5" fill="#7DD3FC"/>
    <circle cx="26" cy="90" r="5" fill="#7DD3FC"/>
    <circle cx="56" cy="90" r="5" fill="#7DD3FC"/>
    <circle cx="86" cy="90" r="5" fill="#7DD3FC"/>
    <circle cx="26" cy="112" r="5" fill="#7DD3FC"/>
    <circle cx="56" cy="112" r="5" fill="#7DD3FC"/>
    <!-- Checkmark naranja grande -->
    <path d="M38 84 L54 100 L92 62" stroke="#F97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- AGENDA cyan -->
  <text x="135" y="84" font-family="'Arial Black',Arial,sans-serif" font-size="56" font-weight="900" fill="#0EA5E9">AGENDA</text>
  <!-- ONLINE naranja -->
