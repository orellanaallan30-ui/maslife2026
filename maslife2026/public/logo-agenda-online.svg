    <line x1="18" y1="4" x2="18" y2="16" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="4" x2="42" y2="16" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="24" x2="56" y2="24" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
