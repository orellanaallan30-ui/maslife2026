<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgendaMaslife</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00a89e',
                        teal: {
                            50: '#f0fdfa',
                            500: '#00a89e',
                            600: '#008c84'
                        },
                        slate: {
                            900: '#0f172a',
                            950: '#020617'
                        }
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            color: #0f172a;
            background-color: #ffffff;
            line-height: 1.5;
            overflow-x: hidden; /* Evita el scroll horizontal en móviles */
        }

        /* --- Ajustes de Tipografía para Móvil --- */
        h1, h2, h3 {
            color: #0f172a !important;
            font-weight: 800 !important;
            line-height: 1.2 !important;
        }

        h1 { font-size: 2.25rem; } /* Desktop */
        h2 { font-size: 1.85rem; }

        @media (max-width: 640px) {
            h1 { font-size: 1.75rem !important; } /* Tamaño moderado en móvil */
            h2 { font-size: 1.5rem !important; }
            h3 { font-size: 1.25rem !important; }
            
            /* Ajuste de padding general para que nada toque los bordes */
            .container-mobile {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }
        }

        p, span, label {
            color: #334155;
        }

        /* --- Fix para Menús y Capas --- */
        #root {
            position: relative;
            z-index: 1;
        }

        /* Si tienes un menú de hamburguesa duplicado, asegúrate de que el fixed
           tenga un z-index superior, pero controlado */
        header {
            z-index: 50;
        }

        .text-primary {
            color: #00a89e !important;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Estilos de Impresión (Mantenidos y optimizados) --- */
        @media print {
            @page { margin: 1.5cm; size: portrait; }
            aside, nav, .no-print, .fixed, button, .material-icons-round {
                display: none !important;
            }
            main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            section { break-inside: avoid; border: 1px solid #e2e8f0 !important; padding: 1rem !important; border-radius: 0.5rem !important; }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-white text-black min-h-screen selection:bg-teal-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
